<title>Dan’s Calgary Live Music Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: gig-guide listing. Filter rail (sticky on roomy screens), months split into one card per date, each card headed by a
   ticket-stub date bar that sticks under the filters. Every row uses the same fixed columns (icon | act | venue | actions) so
   they line up down the page whatever the text length.
   Palette: Calgary red, gold and black on a warm white; music touches are the record and EQ bars in the header, staff lines
   under each month and a genre icon on each show. */
:root {
  --bg: #F5F2EB;
  --surface: #FFFFFF;
  --ink: #111111;
  --muted: #5C5650;
  --line: #DED6C8;
  --chip: #EDE6D8;
  --accent: #C8102E;
  --accent-ink: #FFFFFF;
  --gold: #F1BE48;
  --gold-ink: #111111;
  --star: #C99418;
  --icon: #8A8175;
  --staff: #CBBFA9;
  --t-arena: #C8102E;
  --t-hall: #C99418;
  --t-club: #111111;
  --t-fest: #F26B1D;
  --shadow: rgba(17, 17, 17, .16);
  --day-bg: #111111; --day-ink: #FFFFFF; --day-muted: #BDB5A8; --day-rule: rgba(241, 190, 72, .5);
  --vinyl: #111111; --groove: rgba(255, 255, 255, .1);
  --warn-bg: #FBEFCF; --alert-bg: #FBE4E7; --note-bg: #EDE6D8;
  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0C0C; --surface: #181818; --ink: #F3EFE6; --muted: #A49E94; --line: #2E2B27; --chip: #24211D;
    --accent: #F5364A; --accent-ink: #160406; --gold: #F1BE48; --gold-ink: #111111; --star: #F1BE48; --icon: #8C867C; --staff: #3D3934;
    --t-arena: #F5364A; --t-hall: #F1BE48; --t-club: #F3EFE6; --t-fest: #FF8A3D;
    --shadow: rgba(0, 0, 0, .55);
    --day-bg: #000000; --day-ink: #F3EFE6; --day-muted: #A9A296; --day-rule: rgba(241, 190, 72, .45);
    --vinyl: #262626; --groove: rgba(255, 255, 255, .08);
    --warn-bg: #2E2611; --alert-bg: #33131A; --note-bg: #24211D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C0C0C; --surface: #181818; --ink: #F3EFE6; --muted: #A49E94; --line: #2E2B27; --chip: #24211D;
  --accent: #F5364A; --accent-ink: #160406; --gold: #F1BE48; --gold-ink: #111111; --star: #F1BE48; --icon: #8C867C; --staff: #3D3934;
  --t-arena: #F5364A; --t-hall: #F1BE48; --t-club: #F3EFE6; --t-fest: #FF8A3D;
  --shadow: rgba(0, 0, 0, .55);
  --day-bg: #000000; --day-ink: #F3EFE6; --day-muted: #A9A296; --day-rule: rgba(241, 190, 72, .45);
  --vinyl: #262626; --groove: rgba(255, 255, 255, .08);
  --warn-bg: #2E2611; --alert-bg: #33131A; --note-bg: #24211D;
  color-scheme: dark;
}
* { box-sizing: border-box; }
/* the hidden attribute must win over component display rules (dropdown panels, toast, copy box) */
[hidden] { display: none !important; }
body {
  /* red and gold jersey stripe across the top of the page */
  background: linear-gradient(var(--accent) 0 6px, var(--gold) 6px 9px, transparent 9px) top / 100% 9px no-repeat, var(--bg);
  color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1080px; margin: 0 auto; }
header.top { padding-block: 36px 18px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 28px; align-items: center; }
header.top > * { grid-column: 1; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(40px, 7vw, 68px); line-height: .92; margin: 0; letter-spacing: .01em; text-transform: uppercase; text-wrap: balance; }
h1 .hl { color: var(--accent); }

/* header art: a spinning record and bouncing EQ bars */
header.top > .hero-art { grid-column: 2; grid-row: 1 / span 4; width: 250px; height: auto; }
.hero-art .disc { transform-box: fill-box; transform-origin: center; animation: spin 9s linear infinite; }
.hero-art .eq rect { transform-box: fill-box; transform-origin: 50% 100%; animation: eq 1.3s ease-in-out infinite alternate; }
.hero-art .eq rect:nth-child(2) { animation-delay: -.45s; }
.hero-art .eq rect:nth-child(3) { animation-delay: -.9s; }
.hero-art .eq rect:nth-child(4) { animation-delay: -.2s; }
.hero-art .eq rect:nth-child(5) { animation-delay: -.7s; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes eq { from { transform: scaleY(.35); } to { transform: scaleY(1); } }
@media (max-width: 760px) {
  header.top { grid-template-columns: minmax(0, 1fr); }
  header.top > .hero-art { display: none; }
}
.lede { color: var(--muted); max-width: 68ch; margin: 0; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.stats b { font-family: var(--font-display); font-size: 26px; font-weight: 800; margin-right: 5px; }
.stats span { color: var(--muted); font-size: 13px; }

/* notices above the filters: list out of date, watchlist news, starred shows in trouble */
#banners { display: grid; gap: 8px; }
#banners:not(:empty) { margin-bottom: 12px; }
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px 10px 14px; border-radius: 8px; border-left: 4px solid var(--gold); background: var(--warn-bg); font-size: 14px; }
.banner.alert { border-left-color: var(--accent); background: var(--alert-bg); }
.banner.watch { border-left-color: var(--ink); background: var(--note-bg); }
.banner .bt { flex: 1 1 auto; min-width: 0; }
.banner b { display: block; }
.banner .bl { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.banner .bx { display: flex; gap: 6px; flex: none; align-items: center; }

.filters { background: var(--bg); padding-block: 12px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
/* the filter rail only follows you down the page when there is room for it */
@media (min-width: 900px) and (min-height: 820px) {
  .filters { position: sticky; top: max(env(safe-area-inset-top, 0px), var(--top-off, 0px)); z-index: 5; }
}

/* compact title bar that slides in once the big header has scrolled away; --top-off is its height while shown */
.brand {
  position: fixed; top: 0; left: 0; right: 0; z-index: 12; background: var(--day-bg); color: var(--day-ink);
  padding-top: env(safe-area-inset-top, 0px); box-shadow: 0 6px 18px var(--shadow);
  transform: translateY(-115%); visibility: hidden; transition: transform .22s ease, visibility 0s linear .22s;
}
.brand.on { transform: none; visibility: visible; transition: transform .22s ease, visibility 0s; }
.brand::after { content: ""; position: absolute; left: 0; right: 0; bottom: -5px; height: 5px; background: linear-gradient(var(--accent) 0 3px, var(--gold) 3px 5px); }
.brand .bin {
  max-width: 1080px; margin: 0 auto; min-height: 48px; display: flex; align-items: center; gap: 12px;
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px));
}
.brand .home { display: flex; align-items: center; gap: 10px; min-width: 0; background: none; border: 0; padding: 0; color: inherit; cursor: pointer; font: inherit; }
.brand .logo { width: 44px; height: 34px; flex: none; }
.brand .logo .disc { transform-box: fill-box; transform-origin: center; animation: spin 6s linear infinite; }
.brand .logo .eq rect { transform-box: fill-box; transform-origin: 50% 100%; animation: eq 1.1s ease-in-out infinite alternate; }
.brand .logo .eq rect:nth-child(2) { animation-delay: -.4s; }
.brand .logo .eq rect:nth-child(3) { animation-delay: -.8s; }
.brand .bname { font-family: var(--font-display); font-weight: 800; font-size: 23px; letter-spacing: .03em; text-transform: uppercase; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand .bname .hl { color: var(--accent); }
.brand .legend { margin-left: auto; display: flex; gap: 6px; flex: none; }
.brand .legend button {
  font: inherit; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
  border-radius: 999px; border: 0; background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap;
}
.brand .legend button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--gold); }
@media (max-width: 940px) {
  .brand .legend .lt { display: none; }
  .brand .legend button { padding: 6px; }
}
@media (max-width: 520px) {
  .brand .bname { font-size: 18px; }
  .brand .logo { width: 36px; height: 28px; }
  .brand .legend { gap: 4px; }
}
.frow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.frow > * { min-width: 0; }
input[type=search], input[type=date], select {
  font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 6px; padding: 8px 10px; min-height: 38px;
}
select { cursor: pointer; padding-right: 8px; }
select.active, input[type=date].active { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); font-weight: 600; }
#q { flex: 1 1 200px; }
#when { flex: 0 1 150px; }
.dates { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }

/* multi-select dropdowns */
.ms { position: relative; flex: 0 1 160px; }
.ms-btn {
  width: 100%; font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 6px; padding: 8px 30px 8px 10px; min-height: 38px; text-align: left; cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative;
}
.ms-btn::after {
  content: ""; position: absolute; right: 12px; top: 50%; width: 7px; height: 7px;
  border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: translateY(-70%) rotate(45deg);
}
.ms-btn.active { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); font-weight: 600; }
.ms-panel {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 8; width: 300px; max-width: calc(100vw - 32px);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 32px var(--shadow);
  padding: 8px; display: grid; gap: 6px;
}
.ms-panel.right { left: auto; right: 0; }
.ms-panel input[type=search] { width: 100%; min-height: 34px; padding: 6px 9px; }
.ms-actions { display: flex; justify-content: space-between; gap: 8px; }
.ms-actions button { font: inherit; font-size: 12px; font-weight: 600; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 2px 4px; }
.ms-list { max-height: 300px; overflow-y: auto; display: grid; overscroll-behavior: contain; }
.ms-list label { display: flex; align-items: center; gap: 9px; padding: 6px; border-radius: 5px; cursor: pointer; font-size: 14px; }
.ms-list label:hover { background: var(--chip); }
.ms-list label[hidden] { display: none; }
.ms-list input { accent-color: var(--accent); width: 16px; height: 16px; flex: none; margin: 0; }
.ms-list .lbl { min-width: 0; overflow-wrap: anywhere; }
.ms-list .gi { width: 17px; height: 17px; color: var(--icon); }
.ms-list .n { margin-left: auto; padding-left: 8px; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.ms-empty { font-size: 13px; color: var(--muted); padding: 6px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 4px; }
.tier-btn {
  font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
}
.tier-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.tier-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tier-btn.q[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.tier-btn.q.gone[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tier-btn.ghost { border-style: dashed; color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--muted); }
.dot.arena { background: var(--t-arena); } .dot.hall { background: var(--t-hall); }
.dot.club { background: var(--t-club); } .dot.fest { background: var(--t-fest); }
.meta { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 13px; color: var(--muted); }
.meta .grow { flex: 1 1 auto; font-variant-numeric: tabular-nums; }
.meta select { min-height: 32px; padding: 4px 8px; font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { font: inherit; font-size: 13px; font-weight: 600; border: 0; background: none; color: var(--ink); padding: 5px 11px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.btn {
  font: inherit; font-size: 13px; font-weight: 600; border-radius: 6px; padding: 6px 12px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { padding: 3px 9px; font-size: 12px; }
.linkbtn { font: inherit; font-size: inherit; font-weight: 600; background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { padding-block: 8px 40px; }
section.month { margin-top: 26px; }
.month h2, .listhead {
  font-family: var(--font-display); font-weight: 800; text-transform: uppercase; font-size: 30px; margin: 0 0 8px;
  display: flex; align-items: baseline; gap: 12px; letter-spacing: .02em;
}
.month h2 small, .listhead small { font-family: var(--font-body); font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0; text-transform: none; }
/* five-line music staff running out from each month name */
.month h2::after, .listhead::after {
  content: ""; flex: 1 1 auto; min-width: 40px; height: 13px; align-self: center;
  background: repeating-linear-gradient(to bottom, var(--staff) 0 1px, transparent 1px 3px);
}
.listhead { margin-top: 26px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-top: 14px; }
.month h2 + .day, .listhead + .day { margin-top: 0; }
.day-head {
  position: sticky; top: calc(max(env(safe-area-inset-top, 0px), var(--top-off, 0px)) + var(--filters-h, 0px)); z-index: 3;
  display: flex; align-items: center; gap: 12px; margin: -1px -1px 0; padding: 7px 14px 10px 0;
  background: var(--day-bg); color: var(--day-ink); border-radius: 10px 10px 0 0; box-shadow: inset 0 -3px 0 var(--accent);
  font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
}
.day-head .dn {
  font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1; letter-spacing: 0; color: var(--gold);
  min-width: 64px; padding: 0 12px; text-align: center; border-right: 2px dotted var(--day-rule); font-variant-numeric: tabular-nums;
}
.day-head.grp { padding-left: 16px; }
.day-head .dw { min-width: 0; overflow-wrap: anywhere; }
.day-head .sub { color: var(--gold); font-size: 12px; letter-spacing: .06em; }
.day-head .when { background: var(--accent); color: var(--accent-ink); font-size: 11px; letter-spacing: .06em; padding: 2px 7px; border-radius: 4px; }
.day-head .dc { margin-left: auto; font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--day-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* fixed columns: icon | act | venue | actions */
.row {
  display: grid; grid-template-columns: 64px minmax(0, 1fr) 210px 170px; gap: 4px 12px; align-items: center;
  padding: 11px 14px 11px 0; border-top: 1px dashed var(--line);
}
.day-head + .row { border-top: 0; }
.row.is-hidden { opacity: .5; }
.gicon { display: flex; justify-content: center; color: var(--icon); }
.gi { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.act { min-width: 0; }
.act .artist { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
.act .support { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.act .note { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.act .facts { font-size: 13px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.act .facts .free { color: var(--accent); }
.pill { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; margin-left: 6px; vertical-align: 2px; white-space: nowrap; }
.pill.sold { background: var(--accent); color: var(--accent-ink); }
.pill.tba { background: var(--chip); color: var(--muted); }
.pill.new { background: var(--gold); color: var(--gold-ink); }
.pill.watch { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--gold); }
.pill.cancel, .pill.gone { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.pill.gone { box-shadow: inset 0 0 0 1px var(--accent); border: 1px dashed transparent; cursor: help; }
.row.cancelled .artist, .row.cancelled .support { text-decoration: line-through; text-decoration-color: var(--accent); }
.venue { min-width: 0; font-size: 14px; display: flex; gap: 8px; align-items: baseline; }
.venue .dot { transform: translateY(-1px); }
.venue > div { min-width: 0; overflow-wrap: anywhere; }
.venue .genre { display: block; font-size: 12px; color: var(--muted); }
.venue a.pin { color: var(--muted); display: inline-flex; vertical-align: -3px; margin-left: 3px; }
.venue a.pin:hover { color: var(--accent); }
.venue a.pin svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.acts { display: grid; gap: 3px; justify-items: start; min-width: 0; }
.acts .tix { font-size: 13px; font-weight: 600; color: var(--accent); text-decoration: none; white-space: nowrap; }
.acts .tix:hover { text-decoration: underline; }
.acts .tix.none { color: var(--muted); font-weight: 500; }
.ibtns { display: flex; gap: 2px; margin-left: -5px; }
.ib {
  width: 30px; height: 30px; display: grid; place-items: center; border: 0; border-radius: 6px; background: none;
  color: var(--muted); cursor: pointer; padding: 0; text-decoration: none;
}
.ib:hover { background: var(--chip); color: var(--ink); }
.ib svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ib.star[aria-pressed="true"] { color: var(--star); }
.ib.star[aria-pressed="true"] svg { fill: currentColor; }
.ib.ics[aria-pressed="true"] { color: var(--accent-ink); background: var(--accent); }
.pill.plan { background: var(--ink); color: var(--bg); }

/* menu under a show's calendar button: My calendar, Google, Outlook */
.calmenu {
  position: fixed; z-index: 30; width: 260px; max-width: calc(100vw - 16px); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; box-shadow: 0 12px 32px var(--shadow); padding: 6px; display: grid; gap: 2px;
}
.calmenu .mi {
  font: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 0; border-radius: 6px;
  background: none; color: var(--ink); text-align: left; cursor: pointer; text-decoration: none; width: 100%;
}
.calmenu .mi:hover, .calmenu .mi:focus-visible { background: var(--chip); outline: none; }
.calmenu .mi svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.calmenu .mi.on svg { color: var(--accent); }
.calmenu .mi small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
.calmenu .mh { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 8px 10px 2px; border-top: 1px solid var(--line); margin-top: 4px; }
.empty { padding: 40px 16px; text-align: center; color: var(--muted); }
.lost { margin-top: 18px; padding: 10px 14px; border: 1px dashed var(--line); border-radius: 8px; font-size: 13px; color: var(--muted); }

/* calendar view */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); background: var(--line); gap: 1px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.cal .wh { background: var(--day-bg); color: var(--day-ink); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 7px 8px; }
.cal .cell { background: var(--surface); min-height: 96px; padding: 6px 8px; text-align: left; font: inherit; color: var(--ink); border: 0; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cal .cell.blank { background: var(--bg); }
.cal .cell.past { color: var(--muted); background: var(--bg); }
.cal button.cell { cursor: pointer; }
.cal button.cell:hover { box-shadow: inset 0 0 0 2px var(--gold); }
.cal .cd { font-family: var(--font-display); font-weight: 800; font-size: 20px; line-height: 1; }
.cal .cell.today .cd { color: var(--accent); }
.cal .cn { font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .05em; }
.cal .nm { font-size: 12px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal .nm.starred::before { content: "★ "; color: var(--star); }
.cal .nm.planned::before { content: "✓ "; color: var(--accent); font-weight: 700; }
.cal .more { font-size: 11px; color: var(--muted); }
.cal .cell.planned { box-shadow: inset 0 3px 0 var(--accent); }
/* My calendar: each planned show is a chip in its day */
.cal .chip {
  display: block; width: 100%; border: 0; border-radius: 4px; padding: 3px 6px; margin-top: 2px; text-align: left; cursor: pointer;
  font: inherit; font-size: 12px; line-height: 1.3; background: var(--day-bg); color: var(--day-ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cal .chip b { color: var(--gold); margin-right: 4px; }
.cal .chip.off { background: var(--accent); color: var(--accent-ink); }
.cal .chip.off b { color: inherit; }
.mine-note { font-size: 13px; color: var(--muted); margin: -2px 0 12px; }
.row.flash { box-shadow: inset 4px 0 0 var(--gold); background: var(--warn-bg); transition: background .6s; }

footer { border-top: 1px solid var(--line); padding-block: 24px 48px; display: grid; gap: 22px; color: var(--muted); font-size: 13px; }
footer h3 { font-family: var(--font-display); font-weight: 800; text-transform: uppercase; color: var(--ink); font-size: 22px; margin: 0 0 8px; letter-spacing: .02em; }
footer p { margin: 0 0 6px; max-width: 75ch; }
#watchlist { border-radius: 8px; transition: box-shadow .3s; }
#watchlist.flash { box-shadow: 0 0 0 3px var(--gold); }
.terms { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.terms span { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; color: var(--ink); font-weight: 600; }
.venues { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 4px 18px; }
.venues button { font: inherit; text-align: left; background: none; border: 0; color: var(--ink); padding: 3px 0; cursor: pointer; display: flex; gap: 8px; align-items: center; min-width: 0; }
.venues button .vn { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.venues button:hover span.n { color: var(--accent); }
.venues span.n { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); }
.caveats { max-width: 75ch; display: grid; gap: 6px; }
.caveats p { margin: 0; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--day-bg); color: var(--day-ink); padding: 9px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; z-index: 20; display: flex; gap: 14px; align-items: center; max-width: calc(100vw - 32px); box-shadow: 0 6px 18px var(--shadow); }
.skip { position: absolute; left: -9999px; top: 12px; z-index: 40; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-weight: 600; }
.skip:focus { left: 16px; }
main:focus { outline: none; }
.tier-btn[aria-pressed="true"] .dot.club { box-shadow: 0 0 0 1.5px var(--bg); }
.cal .cn.clash { background: var(--accent); color: var(--accent-ink); border-radius: 3px; padding: 0 4px; align-self: flex-start; }
.toast button { font: inherit; background: none; border: 0; color: var(--gold); cursor: pointer; text-decoration: underline; padding: 0; }
#copybox { width: 100%; min-height: 120px; font: 12px ui-monospace, Consolas, monospace; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; }

@media (max-width: 720px) {
  .row { grid-template-columns: 52px minmax(0, 1fr); gap: 4px 10px; }
  .gicon { grid-row: span 3; align-self: start; padding-top: 2px; }
  .venue, .acts { grid-column: 2; }
  .acts { grid-auto-flow: column; justify-content: start; align-items: center; gap: 10px; }
  .day-head { gap: 10px; font-size: 13px; }
  .day-head .dn { min-width: 52px; font-size: 26px; }
  .ms { flex: 1 1 140px; }
  #when { flex: 1 1 140px; }
  .sep { display: none; }
  .cal .cell { min-height: 54px; padding: 4px 5px; }
  .cal .nm, .cal .more { display: none; }
  .cal .chip { font-size: 0; padding: 0; height: 6px; }
  .cal .cn { font-size: 10px; }
  .cal .wh { padding: 6px 4px; font-size: 10px; letter-spacing: .02em; }
}
@media (max-width: 400px) {
  /* very narrow phones: the ticket link and the icon buttons go on two lines */
  .acts { grid-auto-flow: row; gap: 2px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

  var BANDS = [[0, 0, 'Free'], [0.01, 24.99, 'Under $25'], [25, 49.99, '$25 to $49'], [50, 99.99, '$50 to $99'], [100, 1e9, '$100 and up']];
  function renderGroups(rows) {
    var groups = {}, order = [], title;
    function keyOf(r) {
      if (state.sort === 'venue') return r.venue;
      if (state.sort === 'added') return r.added || '';
      if (r.pmin == null) return 'z';
      for (var i = 0; i < BANDS.length; i++) if (r.pmin >= BANDS[i][0] && r.pmin <= BANDS[i][1]) return 'b' + i;
      return 'z';
    }
    rows.forEach(function (r) { var k = keyOf(r); if (!groups[k]) { groups[k] = []; order.push(k); } groups[k].push(r); });
    if (state.sort === 'venue') { order.sort(function (a, b) { return a.localeCompare(b); }); title = 'By venue'; }
    else if (state.sort === 'added') { order.sort(function (a, b) { return a === b ? 0 : !a ? 1 : !b ? -1 : a < b ? 1 : -1; }); title = 'Newest additions first'; }
    else {
      order.sort(); title = 'By price';
      order.forEach(function (k) { groups[k].sort(function (a, b) { return (a.pmin || 0) - (b.pmin || 0) || (a.date < b.date ? -1 : a.date > b.date ? 1 : 0); }); });
    }
    var h = el('h2', 'listhead', title); h.appendChild(el('small', null, plural(rows.length, 'show'))); out.appendChild(h);
    order.forEach(function (k) {
      var list = groups[k], head = el('h3', 'day-head grp');
      if (state.sort === 'venue') {
        head.appendChild(el('span', 'dw', k));
        var ar = list[0]._area; if (ar && ar !== 'Area not known') head.appendChild(el('span', 'sub', ar));
      } else if (state.sort === 'added') {
        head.appendChild(el('span', 'dw', k ? 'Added ' + dayDate(k) : 'On the list from the start'));
        if (k && k === LATEST) head.appendChild(el('span', 'when', 'Latest'));
      } else {
        head.appendChild(el('span', 'dw', k === 'z' ? 'Price not listed' : BANDS[+k.slice(1)][2]));
      }
      head.appendChild(el('span', 'dc', plural(list.length, 'show')));
      var card = dayCard(head);
      list.forEach(function (r) { card.appendChild(buildRow(r, true)); });
      out.appendChild(card);
    });
  }
  function renderCalendar(rows) {
    var byDate = {}, mlist = [];
    rows.forEach(function (r) { (byDate[r.date] = byDate[r.date] || []).push(r); if (mlist.indexOf(r._m) === -1) mlist.push(r._m); });
    mlist.forEach(function (m) {
      var sec = el('section', 'month'), n = rows.filter(function (r) { return r._m === m; }).length;
      var h2 = el('h2', null, monthLabel(m)); h2.appendChild(el('small', null, plural(n, 'show'))); sec.appendChild(h2);
      var grid = el('div', 'cal');
      WD.forEach(function (w) { grid.appendChild(el('div', 'wh', w)); });
      var p = m.split('-'), first = new Date(+p[0], +p[1] - 1, 1), days = new Date(+p[0], +p[1], 0).getDate();
      for (var i = 0; i < first.getDay(); i++) grid.appendChild(el('div', 'cell blank'));
      for (var d = 1; d <= days; d++) {
        var ds = m + '-' + ('0' + d).slice(-2), list = byDate[ds] || [], cell;
        if (list.length) {
          cell = el('button', 'cell'); cell.type = 'button';
          cell.setAttribute('aria-label', dayDate(ds) + ': ' + plural(list.length, 'show') + '. Show the list for this day.');
          (function (day) { cell.addEventListener('click', function () { showDay(day); }); })(ds);
        } else cell = el('div', 'cell');
        if (ds < TODAY) cell.classList.add('past');
        if (ds === TODAY) cell.classList.add('today');
        if (list.some(function (r) { return plans[r._id]; })) cell.classList.add('planned');
        cell.appendChild(el('span', 'cd', String(d)));
        if (list.length) {
          cell.appendChild(el('span', 'cn', plural(list.length, 'show')));
          var rank = function (r) { return plans[r._id] ? 2 : stars[r._id] ? 1 : 0; };
          list.slice().sort(function (a, b) { return rank(b) - rank(a); }).slice(0, 3).forEach(function (r) {
            var nm = el('span', 'nm' + (plans[r._id] ? ' planned' : stars[r._id] ? ' starred' : ''), r.artist); nm.title = r.artist + ' at ' + r.venue; cell.appendChild(nm);
          });
          if (list.length > 3) cell.appendChild(el('span', 'more', '+' + (list.length - 3) + ' more'));
        }
        grid.appendChild(cell);
      }
      sec.appendChild(grid); out.appendChild(sec);
    });
  }
  // My calendar: everything you added, whatever the filters say. A month grid of your plans, then the shows themselves.
  function planRows() {
    return Object.keys(plans).map(function (id) {
      if (BYID[id]) return BYID[id];
      // no longer on the list (dropped by the sites, renamed, or earlier this month): rebuilt from what was saved
      var p = plans[id];
      return { _ghost: true, _id: id, date: p.d, time: p.t, artist: p.a, venue: p.v, source: p.s, support: '', notes: '', gb: 'Other',
               _d: parseIso(p.d), _m: p.d.slice(0, 7), _akey: norm(p.a), _addr: (VENUES[p.v] || {}).addr || '' };
    }).sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.time || '99') < (b.time || '99') ? -1 : 1; });
  }
  function ghostRow(r) {
    var row = el('div', 'row');
    var gic = el('div', 'gicon'); gic.appendChild(genreIcon('Other')); row.appendChild(gic);
    var act = el('div', 'act'), a = el('div', 'artist', r.artist);
    a.appendChild(el('span', 'pill gone', 'No longer listed'));
    act.appendChild(a);
    act.appendChild(el('div', 'note', 'The listing sites no longer show this. Check with the venue before you go.'));
    if (r.time) act.appendChild(el('div', 'facts', fmtTime(r.time)));
    row.appendChild(act);
    var v = el('div', 'venue'); v.appendChild(el('span', 'dot')); v.appendChild(el('div', null, r.venue)); row.appendChild(v);
    var acts = el('div', 'acts');
    if (r.source) { var lk = el('a', 'tix', 'Tickets & info ↗'); lk.href = r.source; lk.target = '_blank'; lk.rel = 'noopener'; acts.appendChild(lk); }
    var rm = el('button', 'btn small', 'Take off My calendar'); rm.type = 'button';
    rm.addEventListener('click', function () { delete plans[r._id]; savePlans(); render(); });
    acts.appendChild(rm); row.appendChild(acts);
    return row;
  }
  function renderMine() {
    var rows = planRows(), rowEls = {};
    var h = el('h2', 'listhead', 'My calendar'); h.appendChild(el('small', null, plural(rows.length, 'show'))); out.appendChild(h);
    out.appendChild(el('p', 'mine-note', 'Shows you add with the calendar button on any show. Kept in this guide on this PC; the filters above don’t apply here.'));
    if (!rows.length) {
      out.appendChild(el('div', 'empty', 'Nothing on your calendar yet. Click the calendar button on any show and choose "Add to My calendar".'));
      return;
    }
    var mlist = []; rows.forEach(function (r) { if (mlist.indexOf(r._m) === -1) mlist.push(r._m); });
    mlist.forEach(function (m) {
      var mrows = rows.filter(function (r) { return r._m === m; });
      var sec = el('section', 'month'), h2 = el('h2', null, monthLabel(m));
      h2.appendChild(el('small', null, plural(mrows.length, 'show'))); sec.appendChild(h2);
      var grid = el('div', 'cal');
      WD.forEach(function (w) { grid.appendChild(el('div', 'wh', w)); });
      var p = m.split('-'), first = new Date(+p[0], +p[1] - 1, 1), days = new Date(+p[0], +p[1], 0).getDate();
      for (var i = 0; i < first.getDay(); i++) grid.appendChild(el('div', 'cell blank'));
      for (var d = 1; d <= days; d++) {
        var ds = m + '-' + ('0' + d).slice(-2), list = mrows.filter(function (r) { return r.date === ds; }), cell = el('div', 'cell');
        if (ds < TODAY) cell.classList.add('past');
        if (ds === TODAY) cell.classList.add('today');
        if (list.length) cell.classList.add('planned');
        cell.appendChild(el('span', 'cd', String(d)));
        if (list.length > 1) cell.appendChild(el('span', 'cn clash', 'Double-booked'));
        list.forEach(function (r) {
          var chip = el('button', 'chip' + (r.date >= TODAY && (r._ghost || r._cancel || r.gone) ? ' off' : '')); chip.type = 'button';
          if (r.time) chip.appendChild(el('b', null, fmtTime(r.time).replace(':00', '').replace(' ', '').toLowerCase()));
          chip.appendChild(document.createTextNode(r.artist));
          chip.title = r.artist + ' · ' + r.venue + (r.time ? ' · ' + fmtTime(r.time) : '');
          chip.addEventListener('click', function () {
            var t = rowEls[r._id]; if (!t) return;
            t.scrollIntoView({ behavior: 'smooth', block: 'center' }); t.classList.add('flash'); setTimeout(function () { t.classList.remove('flash'); }, 1600);
          });
          cell.appendChild(chip);
        });
        grid.appendChild(cell);
      }
      sec.appendChild(grid);
      // the shows themselves, one card per date
      var curD = null, card = null;
      mrows.forEach(function (r) {
        if (r.date < TODAY) return;   // earlier this month: shown in the grid only
        if (r.date !== curD) { curD = r.date; card = dayCard(dayHead(r)); card.style.marginTop = '14px'; sec.appendChild(card); }
        var row = r._ghost ? ghostRow(r) : buildRow(r, false);
        rowEls[r._id] = row; card.appendChild(row);
      });
      out.appendChild(sec);
    });
  }
  function showDay(ds) {
    state.view = 'list'; mem.set('view', 'list');
    state.when = 'pick'; state.from = ds; state.to = ds;
    render();
    scrollToList();
  }

  // ---------------------------------------------------------------- render
  var whenSel = document.getElementById('when'), fromIn = document.getElementById('from'), toIn = document.getElementById('to');
  var sortSel = document.getElementById('sort'), hiddenBtn = document.getElementById('hiddenBtn'), icsAll = document.getElementById('icsAll');
  function syncControls() {
    Array.prototype.forEach.call(tierWrap.children, function (b) { b.setAttribute('aria-pressed', String(b.dataset.k === state.tier)); });
    syncQuick();
    whenSel.value = state.when; whenSel.classList.toggle('active', state.when !== 'any');
    document.getElementById('dates').hidden = state.when !== 'pick';
    fromIn.value = state.from; toIn.value = state.to;
    fromIn.classList.toggle('active', !!state.from); toIn.classList.toggle('active', !!state.to);
    sortSel.value = state.sort; sortSel.disabled = state.view !== 'list';
    var np = Object.keys(plans).length;
    Array.prototype.forEach.call(document.querySelectorAll('.seg button'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.view === state.view));
      if (b.dataset.view === 'mine') b.textContent = 'My calendar' + (np ? ' · ' + np : '');
    });
    Array.prototype.forEach.call(legendWrap.children, function (b) { b.setAttribute('aria-pressed', String(b.dataset.k === state.tier)); });
    var nh = Object.keys(hidden).length;
    hiddenBtn.hidden = !nh;
    hiddenBtn.textContent = state.showHidden ? 'Hide the ' + nh + ' again' : plural(nh, 'act') + ' hidden · Show';
  }
  function render() {
    closeMenu();
    syncControls();
    out.textContent = '';
    if (state.view === 'mine') {
      var upcoming = planRows().filter(function (r) { return r.date >= TODAY; }).length;
      document.getElementById('count').textContent = 'My calendar: ' + plural(upcoming, 'upcoming show');
      icsAll.textContent = 'Add all to Outlook'; icsAll.hidden = FRAMED || !upcoming;
      renderMine();
    } else {
      var rows = filtered();
      document.getElementById('count').textContent = rows.length === DATA.length ? 'Showing all ' + rows.length + ' shows' : 'Showing ' + rows.length + ' of ' + DATA.length + ' shows';
      icsAll.textContent = 'Add these to Outlook'; icsAll.hidden = FRAMED || !(state.quick === 'mine' && rows.length);
      if (!rows.length) {
        out.appendChild(el('div', 'empty', !DATA.length
          ? 'No shows on the list yet. On the PC, open the Start menu, find Dan’s Calgary Live Music Guide and choose "Update concert list now".'
          : state.quick === 'mine' && !Object.keys(stars).length
          ? 'No starred shows yet. Click the ☆ on any show to keep it here.'
          : 'The stage is quiet: no shows match these filters. Clear a filter or try a shorter search.'));
      } else if (state.view === 'cal') renderCalendar(rows);
      else if (state.sort === 'date') renderByDate(rows);
      else renderGroups(rows);
      if (state.quick === 'mine') lostStars();
    }
    banners();
    // put keyboard focus back on the button that caused the redraw
    if (refocus) {
      var row = out.querySelector('.row[data-id="' + (window.CSS && CSS.escape ? CSS.escape(refocus.id) : refocus.id) + '"]');
      var target = row && row.querySelector('.ib.' + refocus.cls);
      refocus = null;
      if (target) target.focus({ preventScroll: true });
    }
  }
  // starred shows that are no longer on the list (renamed or dropped by the sites)
  function lostStars() {
    var lost = Object.keys(stars).filter(function (id) { return !BYID[id]; });
    if (!lost.length) return;
    var box = el('div', 'lost');
    box.appendChild(el('b', null, plural(lost.length, 'starred show') + ' no longer on the list: '));
    box.appendChild(document.createTextNode(lost.map(function (id) { var s = stars[id]; return s.a + ' (' + shortDate(s.d) + ', ' + s.v + ')'; }).join('; ') + '. Check the venue before you go. '));
    var rm = el('button', 'linkbtn', 'Forget them'); rm.type = 'button';
    rm.addEventListener('click', function () { lost.forEach(function (id) { delete stars[id]; }); saveStars(); render(); });
    box.appendChild(rm);
    out.appendChild(box);
  }

  // ---------------------------------------------------------------- banners
  // what has been dismissed is kept in memory (and saved when the browser allows), so a redraw never brings it back
  var bannerState = { staleClosed: false, seenRun: mem.get('seenRun', null), troubleClosed: '' };
  function markWatchSeen() { bannerState.seenRun = INFO.run; mem.set('seenRun', INFO.run); }
  function banners() {
    var wrap = document.getElementById('banners'); wrap.textContent = '';
    function add(kind, title, lines, buttons, onClose) {
      var b = el('div', 'banner ' + kind), t = el('div', 'bt');
      t.appendChild(el('b', null, title)); if (lines) t.appendChild(el('div', 'bl', lines));
      b.appendChild(t);
      var x = el('div', 'bx');
      (buttons || []).forEach(function (bt) { var k = el('button', 'btn small', bt[0]); k.type = 'button'; k.addEventListener('click', bt[1]); x.appendChild(k); });
      var c = el('button', 'btn small', 'Dismiss'); c.type = 'button';
      c.addEventListener('click', function () { b.remove(); if (onClose) onClose(); });
      x.appendChild(c); b.appendChild(x); wrap.appendChild(b);
    }
    var age = INFO.run ? dayDiff(INFO.run, TODAY) : 0;
    if (age > (INFO.stale_days || 10) && !bannerState.staleClosed) {
      add('', 'This list was last updated ' + age + ' days ago (' + INFO.checked + ').',
        'The weekly refresh may have stopped. On the PC, open the Start menu, find Dan’s Calgary Live Music Guide and choose "Update concert list now".',
        null, function () { bannerState.staleClosed = true; });
    }
    var seen = bannerState.seenRun;
    var fresh = seen === INFO.run ? [] : DATA.filter(function (r) { return r._watch && r.added && (seen ? r.added > seen : r._latest); });
    if (fresh.length) {
      add('watch', fresh.length === 1 ? 'New from your watchlist' : fresh.length + ' new shows from your watchlist',
        fresh.slice(0, 4).map(function (r) { return r.artist + ' (' + dayDate(r.date) + ', ' + r.venue + ')'; }).join(' · ') + (fresh.length > 4 ? ' and ' + (fresh.length - 4) + ' more' : ''),
        [['Show them', function () { markWatchSeen(); state.quick = 'watch'; onFilter(); }]],
        markWatchSeen);
    }
    // starred or planned shows that were cancelled, may be, or have dropped off the list entirely
    var trouble = DATA.filter(function (r) { return (stars[r._id] || plans[r._id]) && (r._cancel || r.gone); })
      .map(function (r) { return r.artist + ' (' + dayDate(r.date) + '): ' + (r._cancel ? 'cancelled' : 'no longer listed by the sites'); });
    var lostPlans = Object.keys(plans).filter(function (id) { return !BYID[id] && plans[id].d >= TODAY; });
    lostPlans.forEach(function (id) { trouble.push(plans[id].a + ' (' + dayDate(plans[id].d) + '): no longer on the list'); });
    // a dismissed warning stays away until the list of problems changes
    var troubleKey = trouble.join('|');
    if (trouble.length && bannerState.troubleClosed !== troubleKey) {
      var btns = [];
      if (Object.keys(plans).length) btns.push(['My calendar', openMine]);
      if (Object.keys(stars).length) btns.push(['My shows', function () { state.view = 'list'; state.quick = 'mine'; render(); }]);
      add('alert', trouble.length === 1 ? 'One of your saved shows may be off' : trouble.length + ' of your saved shows may be off',
        trouble.join(' · '), btns, function () { bannerState.troubleClosed = troubleKey; });
    }
  }

  // ---------------------------------------------------------------- footer
  var wb = document.getElementById('watchbody');
  if (WATCHN.length) {
    var terms = el('div', 'terms'); WATCHN.forEach(function (x) { terms.appendChild(el('span', null, x.w)); }); wb.appendChild(terms);
    var nw = DATA.filter(function (r) { return r._watch; }).length;
    wb.appendChild(el('p', null, plural(nw, 'upcoming show') + ' match. When a refresh finds a new one, Windows shows a notification and it is marked "Watching" here.'));
  } else {
    wb.appendChild(el('p', null, 'Your watchlist is empty. Add the artists and venues you care about, and when a refresh finds a new show from one of them, Windows shows a notification and the show is marked "Watching" here.'));
  }
  wb.appendChild(el('p', null, 'To change it on the PC: Start menu › Dan’s Calgary Live Music Guide › Edit watchlist. Type one name per line, save, close Notepad and press a key in the window that opened; the guide reopens with your changes.'));
  var vWrap = document.getElementById('venues');
  var tierOf = {}; DATA.forEach(function (r) { tierOf[r.venue] = r.tier; });
  Object.keys(venueCount).sort(function (a, b) { return venueCount[b] - venueCount[a] || a.localeCompare(b); }).forEach(function (v) {
    var b = el('button'); b.type = 'button'; b.title = v + ((VENUES[v] || {}).area ? ' · ' + VENUES[v].area : '');
    b.appendChild(el('span', 'dot ' + tierOf[v])); b.appendChild(el('span', 'vn', v)); b.appendChild(el('span', 'n', String(venueCount[v])));
    b.addEventListener('click', function () { msVenue.set([v]); state.tier = 'all'; state.view = 'list'; render(); scrollToList(); });
    vWrap.appendChild(b);
  });
  var cav = document.getElementById('caveats');
  INFO.caveats.forEach(function (c) { cav.appendChild(el('p', null, c)); });

  // ---------------------------------------------------------------- controls
  // redraw once typing pauses rather than on every key
  var searchT;
  document.getElementById('q').addEventListener('input', function (e) {
    clearTimeout(searchT);
    searchT = setTimeout(function () { state.q = e.target.value; onFilter(); }, 120);
  });
  whenSel.addEventListener('change', function () { state.when = whenSel.value; if (state.when !== 'pick') { state.from = ''; state.to = ''; } onFilter(); });
  fromIn.addEventListener('change', function () { state.from = fromIn.value; onFilter(); });
  toIn.addEventListener('change', function () { state.to = toIn.value; onFilter(); });
  sortSel.addEventListener('change', function () { state.sort = sortSel.value; mem.set('sort', state.sort); render(); });
  Array.prototype.forEach.call(document.querySelectorAll('.seg button'), function (b) {
    b.addEventListener('click', function () { state.view = b.dataset.view; mem.set('view', state.view); render(); });
  });
  hiddenBtn.addEventListener('click', function () { state.showHidden = !state.showHidden; onFilter(); });
  icsAll.addEventListener('click', function () {
    if (state.view === 'mine') addToCalendar(planRows().filter(function (r) { return r.date >= TODAY; }), 'my-calendar.ics');
    else addToCalendar(filtered(), 'my-starred-shows.ics');
  });
  document.getElementById('clear').addEventListener('click', function () {
    clearTimeout(searchT);
    state.q = ''; state.tier = 'all'; state.quick = ''; state.when = 'any'; state.from = ''; state.to = ''; state.showHidden = false;
    document.getElementById('q').value = ''; msVenue.clear(); msArea.clear(); msMonth.clear(); msGenre.clear(); onFilter();
  });

  // the midnight reload keeps the search, filters and scroll position (this tab only)
  function keepSession() {
    try {
      sessionStorage.setItem('dclmg:session', JSON.stringify({
        q: state.q, tier: state.tier, quick: state.quick, when: state.when, from: state.from, to: state.to, showHidden: state.showHidden,
        ms: { venue: msVenue.keys(), area: msArea.keys(), month: msMonth.keys(), genre: msGenre.keys() }, y: window.pageYOffset
      }));
    } catch (e) { }
  }
  function restoreSession() {
    var s = null;
    try { s = JSON.parse(sessionStorage.getItem('dclmg:session') || 'null'); sessionStorage.removeItem('dclmg:session'); } catch (e) { }
    if (!s) return null;
    ['q', 'tier', 'quick', 'when', 'from', 'to', 'showHidden'].forEach(function (k) { if (s[k] != null) state[k] = s[k]; });
    document.getElementById('q').value = state.q || '';
    if (s.ms) { msVenue.set(s.ms.venue || []); msArea.set(s.ms.area || []); msMonth.set(s.ms.month || []); msGenre.set(s.ms.genre || []); }
    return s;
  }

  var toastT, toastFn = null;
  var toastEl = document.getElementById('toast'), toastBtn = document.getElementById('toastbtn');
  function toast(msg, action, fn) {
    document.getElementById('toastmsg').textContent = msg;
    toastBtn.hidden = !action; toastBtn.textContent = action || ''; toastFn = fn || null;
    toastEl.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { toastEl.hidden = true; }, action ? 6000 : 3000);
  }
  toastBtn.addEventListener('click', function () { toastEl.hidden = true; if (toastFn) toastFn(); });
  var box = document.getElementById('copybox');
  box.addEventListener('keydown', function (e) { if (e.key === 'Escape') box.hidden = true; });
  box.addEventListener('blur', function () { box.hidden = true; });
  document.getElementById('copy').addEventListener('click', function () {
    // the list on screen: My calendar's shows in that view, otherwise the filtered list
    var rows = state.view === 'mine' ? planRows().filter(function (r) { return r.date >= TODAY; }) : filtered();
    var lines = ['Date\tDay\tTime\tArtist\tSupport\tVenue\tArea\tGenre\tPrice\tNotes\tLink'];
    rows.forEach(function (r) {
      lines.push([r.date, WD[r._d.getDay()], fmtTime(r.time), r.artist, r.support, r.venue, r._area, r.genre, fmtPrice(r), r.notes, r.source]
        .map(function (x) { return (x || '').replace(/[\t\r\n]+/g, ' '); }).join('\t'));
    });
    var text = lines.join('\n');
    function fallback() { box.hidden = false; box.value = text; box.focus(); box.select(); toast('Press Ctrl+C to copy, then Esc to close the box'); }
    try {
      navigator.clipboard.writeText(text).then(function () { box.hidden = true; toast('Copied ' + rows.length + ' shows. Paste into Excel.'); }, fallback);
    } catch (e) { fallback(); }
  });

  // keep the date headers just below the filter bar while it is sticky; its height changes with the window width
  var filtersEl = document.querySelector('.filters');
  function setStick() {
    var h = getComputedStyle(filtersEl).position === 'sticky' ? Math.floor(filtersEl.getBoundingClientRect().height) : 0;
    document.documentElement.style.setProperty('--filters-h', h + 'px');
  }
  if (window.ResizeObserver) new ResizeObserver(setStick).observe(filtersEl);
  window.addEventListener('resize', setStick);
  var stickyMq = window.matchMedia('(min-width: 900px) and (min-height: 820px)');
  if (stickyMq.addEventListener) stickyMq.addEventListener('change', setStick); else stickyMq.addListener(setStick);
  setStick();

  var restored = restoreSession();
  render();
  if (restored && restored.y) window.scrollTo(0, restored.y);
})();
</script>
